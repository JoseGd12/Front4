version: '3.8'

services:
  barberia-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barberia-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=https://manito-api.onrender.com
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
      - VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID}
      - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY}
      - VITE_EMAILJS_SERVICE_ID=${VITE_EMAILJS_SERVICE_ID}
      - VITE_EMAILJS_TEMPLATE_ID_CANCELACION=${VITE_EMAILJS_TEMPLATE_ID_CANCELACION}
      - VITE_EMAILJS_PUBLIC_KEY=${VITE_EMAILJS_PUBLIC_KEY}
      - VITE_INSTAGRAM_TOKEN=${VITE_INSTAGRAM_TOKEN}
      - VITE_FACEBOOK_PAGE_ID=${VITE_FACEBOOK_PAGE_ID}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - barberia-network

networks:
  barberia-network:
    driver: bridge
